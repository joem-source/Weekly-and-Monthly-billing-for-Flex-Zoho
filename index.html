<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rental Billing Calculator</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --text: #1d2330; --muted: #667085;
    --line: #d9dde5; --accent: #1f5fbf; --accent-text: #ffffff; --zero: #a15c00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171c; --card: #1d2128; --text: #e7eaf0; --muted: #98a2b3;
      --line: #333944; --accent: #4d8ef0; --accent-text: #0b1220; --zero: #f0b45a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; margin-bottom: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .hint { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font: inherit; }
  .seg { display: flex; gap: 0; }
  .seg button { flex: 1; padding: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
    font: inherit; cursor: pointer; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; border-left: none; }
  .seg button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
  .btn { padding: 9px 16px; border-radius: 6px; border: 1px solid var(--accent); background: var(--accent);
    color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .msg { color: var(--muted); font-size: 13px; }
  .err { color: #d43c3c; font-size: 13px; }
  textarea { width: 100%; min-height: 220px; padding: 10px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--text); font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  .summary { display: flex; gap: 22px; flex-wrap: wrap; margin: 6px 0 12px; font-size: 14px; }
  .summary b { font-variant-numeric: tabular-nums; }
  ul.lines { list-style: none; padding: 0; margin: 12px 0 0; }
  ul.lines li { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line);
    font: 13px/1.4 ui-monospace, Menlo, Consolas, monospace; }
  ul.lines li span { flex: 1; overflow-wrap: anywhere; }
  ul.lines li.zero span { color: var(--zero); }
  ul.lines li button { padding: 4px 10px; font-size: 12px; border-radius: 5px; border: 1px solid var(--line);
    background: transparent; color: var(--text); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Rental Billing Calculator</h1>
  <p class="sub">Builds weekly or monthly invoice lines to paste into Flex parent contracts.</p>

  <div class="card">
    <div class="grid">
      <div>
        <label for="contract">Contract #</label>
        <input id="contract" placeholder="080715">
      </div>
      <div>
        <label>Billing cycle</label>
        <div class="seg" id="cycle">
          <button type="button" data-v="Weekly" class="on">Weekly</button>
          <button type="button" data-v="Monthly">Monthly</button>
        </div>
      </div>
      <div>
        <label for="start">Use start date</label>
        <input id="start" type="date">
      </div>
      <div>
        <label for="end">Use end date <span class="hint">Optional — sets the count if # of periods is blank</span></label>
        <input id="end" type="date">
      </div>
      <div>
        <label for="amount">Amount</label>
        <input id="amount" inputmode="decimal" placeholder="909.50">
      </div>
      <div>
        <label for="amountMode">Amount is…</label>
        <select id="amountMode">
          <option value="per">Per week / month</option>
          <option value="total">Total for whole rental (split evenly)</option>
        </select>
      </div>
      <div>
        <label for="periods"><span id="periodsLabel">Billing weeks</span> <span class="hint">Leave blank to figure from end date</span></label>
        <input id="periods" type="number" min="1" step="1">
      </div>
      <div>
        <label for="zeros">$0 invoices <span class="hint">Invoice #s to bill $0, e.g. 12, 13</span></label>
        <input id="zeros" placeholder="12, 13">
      </div>
      <div>
        <label for="firstInvoice">First invoice date <span class="hint">Optional — defaults to use start date</span></label>
        <input id="firstInvoice" type="date">
      </div>
      <div>
        <label for="dueDays">Due (days after invoice)</label>
        <input id="dueDays" type="number" min="0" step="1" value="30">
      </div>
      <div>
        <label for="startNum">Starting invoice #</label>
        <input id="startNum" type="number" min="1" step="1" value="1">
      </div>
    </div>
    <div class="actions">
      <button class="btn" id="go" type="button">Generate lines</button>
      <button class="btn ghost" id="clear" type="button">Clear</button>
      <span class="err" id="err"></span>
    </div>
  </div>

  <div class="card" id="results" hidden>
    <div class="summary" id="summary"></div>
    <textarea id="out" readonly></textarea>
    <div class="actions">
      <button class="btn" id="copyAll" type="button">Copy all lines</button>
      <span class="msg" id="copied"></span>
    </div>
    <ul class="lines" id="lines"></ul>
  </div>
</main>

<script>
// ---------- date helpers (local dates, no timezone drift) ----------
function parseDate(s) {
  if (!s) return null;
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function addMonths(d, n) {
  const day = d.getDate();
  const x = new Date(d.getFullYear(), d.getMonth() + n, 1);
  const last = new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate();
  x.setDate(Math.min(day, last));
  return x;
}
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function fmtShort(d) { return (d.getMonth() + 1) + '/' + d.getDate(); }
function fmtFull(d) { return (d.getMonth() + 1) + '/' + String(d.getDate()).padStart(2, '0') + '/' + d.getFullYear(); }
function fmtMoney(c) {
  if (c === 0) return '$0';
  return '$' + (c / 100).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

// ---------- core calculation ----------
function buildLines(o) {
  const start = o.start, end = o.end, monthly = o.cycle === 'Monthly';
  const periodStart = i => monthly ? addMonths(start, i) : addDays(start, 7 * i);

  let count = o.periods;
  if (!count) {
    if (!end) throw new Error('Enter either the number of billing periods or a use end date.');
    if (end < start) throw new Error('Use end date is before the start date.');
    count = 0;
    while (periodStart(count) <= end) count++;
  }

  const zeroSet = new Set(o.zeros);
  const numbers = Array.from({ length: count }, (_, i) => o.startNum + i);
  const billable = numbers.filter(n => !zeroSet.has(n)).length;
  if (billable === 0) throw new Error('Every invoice is marked $0.');

  // amounts in cents
  const amtCents = Math.round(o.amount * 100);
  let perCents = amtCents, remainder = 0;
  if (o.mode === 'total') {
    perCents = Math.floor(amtCents / billable);
    remainder = amtCents - perCents * billable; // extra cents go on the last billable invoice
  }
  const lastBillable = numbers.filter(n => !zeroSet.has(n)).pop();

  const invoiceBase = o.firstInvoice || start;
  const lines = [];
  let total = 0;
  for (let i = 0; i < count; i++) {
    const n = numbers[i];
    const pStart = periodStart(i);
    let pEnd = addDays(periodStart(i + 1), -1);
    if (end && pEnd > end) pEnd = end;
    const inv = monthly ? addMonths(invoiceBase, i) : addDays(invoiceBase, 7 * i);
    const due = addDays(inv, o.dueDays);
    let cents = zeroSet.has(n) ? 0 : perCents + (n === lastBillable ? remainder : 0);
    total += cents;
    const text = `(${o.contract}) ${o.cycle} Invoice #${n} (${fmtShort(pStart)}-${fmtShort(pEnd)}): (${fmtMoney(cents)}) on ${fmtFull(inv)}, due ${fmtFull(due)}`;
    lines.push({ text, zero: cents === 0 });
  }
  return { lines, total, count, billable };
}

// ---------- UI ----------
if (typeof document !== 'undefined') {
  const $ = id => document.getElementById(id);
  let cycle = 'Weekly';

  $('cycle').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    cycle = b.dataset.v;
    [...$('cycle').children].forEach(x => x.classList.toggle('on', x === b));
    $('periodsLabel').textContent = cycle === 'Weekly' ? 'Billing weeks' : 'Billing months';
  });

  function copy(text, note) {
    navigator.clipboard.writeText(text).then(() => {
      $('copied').textContent = note; setTimeout(() => $('copied').textContent = '', 1800);
    }, () => { $('out').select(); document.execCommand('copy'); });
  }

  $('go').addEventListener('click', () => {
    $('err').textContent = '';
    try {
      const contract = $('contract').value.trim();
      const start = parseDate($('start').value);
      const amount = parseFloat($('amount').value.replace(/[$,]/g, ''));
      if (!contract) throw new Error('Enter a contract #.');
      if (!start) throw new Error('Enter a use start date.');
      if (isNaN(amount)) throw new Error('Enter an amount.');
      const res = buildLines({
        contract, cycle, start, amount,
        end: parseDate($('end').value),
        mode: $('amountMode').value,
        periods: parseInt($('periods').value, 10) || 0,
        zeros: $('zeros').value.split(/[,\s]+/).map(Number).filter(n => n > 0),
        firstInvoice: parseDate($('firstInvoice').value),
        dueDays: parseInt($('dueDays').value, 10) || 0,
        startNum: parseInt($('startNum').value, 10) || 1,
      });
      $('out').value = res.lines.map(l => l.text).join('\n');
      $('summary').innerHTML =
        `<span>Invoices: <b>${res.count}</b></span><span>Billable: <b>${res.billable}</b></span><span>Total billed: <b>${fmtMoney(res.total)}</b></span>`;
      const ul = $('lines'); ul.innerHTML = '';
      res.lines.forEach(l => {
        const li = document.createElement('li'); if (l.zero) li.className = 'zero';
        const s = document.createElement('span'); s.textContent = l.text;
        const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Copy';
        b.onclick = () => { navigator.clipboard.writeText(l.text); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200); };
        li.append(s, b); ul.append(li);
      });
      $('results').hidden = false;
    } catch (e) { $('err').textContent = e.message; $('results').hidden = true; }
  });

  $('copyAll').addEventListener('click', () => copy($('out').value, 'Copied all lines'));
  $('clear').addEventListener('click', () => {
    ['contract','start','end','amount','periods','zeros','firstInvoice'].forEach(id => $(id).value = '');
    $('dueDays').value = 30; $('startNum').value = 1; $('results').hidden = true; $('err').textContent = '';
  });
}
if (typeof module !== 'undefined') module.exports = { buildLines, parseDate };
</script>
</body>
</html>
